name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check-code:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development dependencies
        run: make _setup_dev_env
      - name: Check Python source
        run: make check_code
      - name: Check JavaScript card syntax
        run: node --check custom_components/wine_cellar/frontend/wine-cellar-card.js
      - name: Unit tests
        run: make test

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: topics

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
